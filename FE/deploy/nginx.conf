user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;
    set_real_ip_from 192.168.1.201;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    geo $realip_remote_addr $allowed_transport {
        default 0;
        127.0.0.1/32 1;
        192.168.1.0/24 1;
    }
    map "$realip_remote_addr:$http_x_forwarded_proto" $verified_scheme {
        default $scheme;
        "192.168.1.201:https" https;
        "192.168.1.201:http" http;
    }
    map "$realip_remote_addr:$remote_addr:$http_x_real_ip" $verified_client_ip {
        default $remote_addr;
        "192.168.1.201:192.168.1.201:192.168.1.201" 192.168.1.201;
        ~^192\.168\.1\.201:192\.168\.1\.201: unknown;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/myworkspace/current;
        index index.html;
        charset utf-8;

        if ($allowed_transport = 0) { return 403; }

        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /api/ {
            client_max_body_size 128k;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-MyWorkspace-Client-IP $verified_client_ip;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $verified_scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }
    }
}
