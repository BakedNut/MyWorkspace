name: frontend

on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['FE/**', '.github/workflows/fe.yml']
  pull_request:
    branches: [main, develop]
    paths: ['FE/**', '.github/workflows/fe.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
