name: backend

on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['BE/**', '.github/workflows/be.yml']
  pull_request:
    branches: [main, develop]
    paths: ['BE/**', '.github/workflows/be.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: BE/pom.xml
      - run: ./mvnw --batch-mode verify
      - name: deployment regression tests
        run: sudo python3 -m unittest discover -s deploy -p 'test_*.py' -v

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: myworkspace_ci
          MYSQL_USER: integration
          MYSQL_PASSWORD: integration-test-only
          MYSQL_ROOT_PASSWORD: root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/myworkspace_ci?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      MYSQL_TEST_USERNAME: integration
      MYSQL_TEST_PASSWORD: integration-test-only
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: BE/pom.xml
      - run: ./mvnw --batch-mode -Dtest=MySqlIntegrationTest verify
